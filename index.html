<!-- FIXED BANNER - 3 TIMER ONLY, FULL WIDTH, NO SPACE KOSONG, UKURAN TETAP -->
<div class="mx-2 mt-2" style="background:linear-gradient(90deg,#C1272D,#991B1B); border-radius:10px; display:flex; justify-content:space-between; align-items:center; padding:8px 12px;">
  <div class="text-white">
    <div style="font-weight:700; font-size:13px; line-height:1; opacity:.9">SPECIAL DISC</div>
    <div style="font-weight:800; font-size:22px; line-height:1">50%</div>
  </div>
  <div style="display:flex; gap:6px;">
    <div style="background:white; border-radius:7px; min-width:42px; padding:3px 6px; text-align:center;">
      <div id="h" style="font-weight:800; font-size:15px; color:#C1272D; line-height:1">23</div>
      <div style="font-size:9px; font-weight:700; color:#C1272D;">Jam</div>
    </div>
    <div style="background:white; border-radius:7px; min-width:42px; padding:3px 6px; text-align:center;">
      <div id="m" style="font-weight:800; font-size:15px; color:#C1272D; line-height:1">59</div>
      <div style="font-size:9px; font-weight:700; color:#C1272D;">Menit</div>
    </div>
    <div style="background:white; border-radius:7px; min-width:42px; padding:3px 6px; text-align:center;">
      <div id="s" style="font-weight:800; font-size:15px; color:#C1272D; line-height:1">04</div>
      <div style="font-size:9px; font-weight:700; color:#C1272D;">Detik</div>
    </div>
  </div>
</div>

<script>
function updateCountdown(){
  const now=new Date(); const end=new Date(); end.setHours(23,59,59,999);
  let diff=end-now; if(diff<0) diff+=86400000;
  const h=Math.floor(diff/3600000), m=Math.floor(diff%3600000/60000), s=Math.floor(diff%60000/1000);
  document.getElementById('h').innerText=String(h).padStart(2,'0');
  document.getElementById('m').innerText=String(m).padStart(2,'0');
  document.getElementById('s').innerText=String(s).padStart(2,'0');
}
setInterval(updateCountdown,1000); updateCountdown();
</script>
