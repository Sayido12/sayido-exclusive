<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SAYIDO.ID - Special Disc 50%</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>body{font-family:system-ui;background:#FFFBF7}.promo-bar{background:linear-gradient(90deg,#DC2626 0%,#991B1B 100%);display:flex;align-items:center;justify-content:space-between;padding:8px 12px}.timer-mini{background:rgba(0,0,0,0.28);border-radius:8px;min-width:44px;padding:4px 6px;text-align:center}.mockup-2{background:#E8E6E6;border-radius:14px;aspect-ratio:1/0.95;display:flex;gap:8px;align-items:center;justify-content:center;padding:10px}.phone{width:46%;aspect-ratio:9/19.5;background:white;border:1.5px solid #111;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,.18);overflow:hidden;display:flex;flex-direction:column}</style></head><body class="max-w-[420px] mx-auto bg-[#FFFBF7] pb-[80px]">
<header class="flex justify-between items-center px-4 py-3 bg-[#FFFBF7] sticky top-0 z-30 shadow-sm"><div class="flex items-center gap-2"><i class="fa-solid fa-chevron-left text-[#0F2A4A]"></i><div class="font-extrabold text-[20px] text-[#0F2A4A]" style="font-family:serif">SAYIDO.ID</div></div><div class="flex gap-4 text-[#0F2A4A] text-[18px]"><i class="fa-solid fa-magnifying-glass"></i><div class="relative"><i class="fa-solid fa-cart-shopping"></i><span class="absolute -top-2 -right-2 bg-[#C1272D] text-white text-[8px] w-4 h-4 rounded-full flex items-center justify-center">1</span></div></div></header>
<div class="mx-0 promo-bar sticky top-[52px] z-20"><div class="text-white font-extrabold text-[16px]">SPECIAL DISC 50%</div><div class="flex gap-1.5"><div class="timer-mini"><div id="h" class="text-white font-extrabold text-[17px] leading-none">23</div><div class="text-white/80 text-[9px] font-bold">Jam</div></div><div class="timer-mini"><div id="m" class="text-white font-extrabold text-[17px] leading-none">59</div><div class="text-white/80 text-[9px] font-bold">Menit</div></div><div class="timer-mini"><div id="s" class="text-white font-extrabold text-[17px] leading-none">04</div><div class="text-white/80 text-[9px] font-bold">Detik</div></div></div></div>
<div id="grid" class="grid grid-cols-2 gap-2.5 p-2.5 mt-1"></div>
<div id="orderModal" class="fixed inset-0 bg-black/75 hidden z-[60] p-3 overflow-auto"><div class="bg-white max-w-[400px] mx-auto rounded-[20px] p-5 mt-2"><div class="flex justify-between items-center"><h2 class="font-extrabold text-[14px] text-[#0F2A4A]">Order <span id="modalThemeName">FLORAL 5</span></h2><button onclick="closeModal()" class="text-[20px]">✕</button></div><div class="mt-1 text-[10px] text-[#C1272D] font-bold">SPECIAL DISC 50% - <span id="countdownModal">23:59:04</span> lagi!</div><div class="mt-4 space-y-2.5"><div class="grid grid-cols-2 gap-2"><input id="f_groom" placeholder="Nama pria *" class="w-full border rounded-xl p-3 text-[12px]"><input id="f_bride" placeholder="Nama wanita *" class="w-full border rounded-xl p-3 text-[12px]"></div><input id="f_wa" placeholder="No WA aktif *" class="w-full border rounded-xl p-3 text-[12px]"><input id="f_date" type="date" class="w-full border rounded-xl p-3 text-[12px]"><input id="f_maps" placeholder="Alamat / GMaps *" class="w-full border rounded-xl p-3 text-[12px]"></div><div class="mt-4 bg-[#0F2A4A] text-white rounded-xl p-3.5"><div class="flex justify-between text-[11px] opacity-80"><span>Subtotal</span><span id="subVal">Rp99.000</span></div><div class="flex justify-between font-extrabold text-[13px] mt-1"><span>Total (Disc 50%)</span><span id="totalVal">Rp49.500</span></div></div><button onclick="sendWA()" class="w-full mt-4 bg-[#0F2A4A] text-white py-3.5 rounded-full font-extrabold text-[13px]">Kirim Form ke WA Admin →</button></div></div>
<script>
let themes=[]; [['FLORAL',10],['BUGOY',10],['NAVY',5],['LUXU',10],['SAGE',5],['RUSTIC',10]].forEach(([pre,cnt])=>{for(let i=1;i<=cnt;i++){themes.push({name: pre+' '+i, realName: pre+' '+i, pre, num:i, price:99000, fake:338000})}});
function mockup2HP(t){const bg=t.pre=='FLORAL'?'https://images.unsplash.com/photo-1519225421980-715cb0215aed?q=80&w=400&fit=crop':'https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?q=80&w=400&fit=crop'; return `<div class="mockup-2"><div class="phone"><div style="flex:1;background:url('${bg}') center/cover"></div></div><div class="phone"><div style="flex:1;background:url('${bg}') center/cover"></div></div></div>`;}
function render(){const g=document.getElementById('grid'); g.innerHTML=''; themes.forEach(t=>{const d=document.createElement('div'); d.className='bg-white rounded-[14px] border border-[#D4AF37]/20 shadow-sm p-1.5 flex flex-col'; d.innerHTML=`<div class="relative">${mockup2HP(t)}<div class="absolute top-1.5 left-1.5 z-10 bg-[#0F2A4A] text-white text-[9px] font-bold px-2.5 py-1 rounded-lg">New 🔥</div><div class="absolute top-1.5 right-1.5 z-10 bg-[#C1272D] text-white text-[9px] font-bold px-2.5 py-1 rounded-lg">Best 👑</div></div><div class="px-1 pt-2.5 pb-1 text-center"><div class="font-extrabold text-[13px] text-[#0F2A4A]">FLORAL 5</div><div class="flex justify-center items-center gap-1.5 mt-1.5"><div class="bg-[#C1272D] text-white text-[9px] font-bold px-1.5 py-0.5 rounded">50%</div><div class="text-[11px] line-through text-gray-400">Rp. ${t.fake.toLocaleString('id-ID')}</div></div><div class="font-extrabold text-[16px] text-[#0F2A4A]">Rp. ${t.price.toLocaleString('id-ID')}</div><div class="grid grid-cols-2 gap-1.5 mt-2.5"><button onclick="openPrev('${t.realName}')" class="border text-[11px] py-2 rounded-xl font-bold"><i class="fa-regular fa-eye"></i> Preview</button><button onclick="openModal('${t.realName}',${t.price})" class="bg-[#0F2A4A] text-white text-[11px] py-2 rounded-xl font-bold"><i class="fa-solid fa-cart-shopping"></i> Order</button></div></div>`; g.appendChild(d);});}
function updateCountdown(){const now=new Date(); const end=new Date(); end.setHours(23,59,59,999); let diff=end-now; if(diff<0) diff+=86400000; const h=Math.floor(diff/3600000), m=Math.floor(diff%3600000/60000), s=Math.floor(diff%60000/1000); document.getElementById('h').innerText=String(h).padStart(2,'0'); document.getElementById('m').innerText=String(m).padStart(2,'0'); document.getElementById('s').innerText=String(s).padStart(2,'0'); const modal=document.getElementById('countdownModal'); if(modal) modal.innerText=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
setInterval(updateCountdown,1000); updateCountdown(); render();
let curName='',curPrice=0;
function openModal(name,price){curName=name; curPrice=price; document.getElementById('modalThemeName').innerText=name; document.getElementById('subVal').innerText='Rp'+price.toLocaleString('id-ID'); document.getElementById('totalVal').innerText='Rp'+Math.round(price*0.5).toLocaleString('id-ID'); document.getElementById('orderModal').classList.remove('hidden');}
function closeModal(){document.getElementById('orderModal').classList.add('hidden');}
function openPrev(name){alert('Preview '+name);}
function sendWA(){const groom=document.getElementById('f_groom').value.trim(), bride=document.getElementById('f_bride').value.trim(), wa=document.getElementById('f_wa').value.trim(); if(!groom||!bride||!wa){alert('Isi Nama & WA');return;} const orderId='SAY-'+Math.random().toString(36).substring(2,7).toUpperCase(); const total=Math.round(curPrice*0.5); const h=document.getElementById('h').innerText, m=document.getElementById('m').innerText, s=document.getElementById('s').innerText; const txt=`Halo Admin SAYIDO.ID %0AORDER BARU ${orderId}%0ATema: ${curName}%0A${groom} & ${bride}%0AWA: ${wa}%0ATotal: Rp${total.toLocaleString('id-ID')} (Disc 50%)%0ASisa ${h}:${m}:${s} - Special Disc 50%!`; window.open(`https://wa.me/6281908112259?text=${txt}`,'_blank'); closeModal();}
</script>
<div class="fixed bottom-0 w-full max-w-[420px] bg-white border-t flex justify-around py-2.5 text-[11px]"><span>Home</span><span class="font-bold border-b-2 border-[#D4AF37]">Catalog</span><span>Orders</span><span>Profile</span></div>
</body></html>
