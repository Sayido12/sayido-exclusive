<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAYIDO EXCLUSIVE - 57% OFF</title>
<style>
*{box-sizing:border-box;margin:0;font-family:sans-serif}
body{background:#F8FAFC;padding:20px}
h1{text-align:center;font-weight:900;font-size:28px;margin:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;max-width:1000px;margin:0 auto}
.card{background:white;border:1px solid #ddd;border-radius:12px;padding:12px;text-align:center}
.img{background:#0F172A;color:white;padding:50px 0;border-radius:8px;font-weight:800}
.price{margin-top:8px;font-weight:700}
.off{background:red;color:white;padding:2px 6px;border-radius:10px;font-size:12px}
</style>
</head>
<body>
<h1>SAYIDO EXCLUSIVE - 57% OFF - FIXED!</h1>
<div class="grid">
<script>
const items=["SACI","MONOCH","LOLY","MORAN","MACA","TERA","GOLD","MAROON","ALLUR","TULIP","NAVY","SAGE"];
document.write(items.map(x=>`<div class="card"><div class="img">${x}</div><div class="price">${x}</div><div>149k <span class="off">57% OFF</span></div></div>`).join(''));
</script>
</div>
</body>
</html>
