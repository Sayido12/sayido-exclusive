<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAYIDO EXCLUSIVE - 57% OFF</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}
body{background:#EEF2FF}
.header{position:sticky;top:0;z-index:10;background:white;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;box-shadow:0 2px 10px #0001}
.logo{font-weight:800;font-size:22px;color:#0F172A} .logo span{color:#E11D48}
.login{background:#FFC2D1;color:#E11D48;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700}
.promo{background:#BE123C;color:white;display:flex;justify-content:center;gap:12px;align-items:center;padding:10px;font-weight:700;font-size:14px;flex-wrap:wrap}
.promo b{background:#7F1D1D;padding:4px 8px;border-radius:6px;margin-left:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;max-width:480px;margin:0 auto}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px #0001;position:relative}
.badge{position:absolute;top:8px;left:8px;z-index:2;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:800;color:white;display:flex;align-items:center;gap:3px}
.badge.new{background:#0F172A} .badge.best{background:#DC2626}
.imgbox{background:#F8FAFC;padding:10px} .imgbox img{width:100%;border-radius:12px;aspect-ratio:4/5;object-fit:cover;background:#E2E8F0}
.info{padding:10px 10px 12px}
.title{font-size:13px;font-weight:700;color:#0F172A;display:flex;align-items:center;gap:4px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pricebox{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.off{background:#DC2626;color:white;padding:3px 6px;border-radius:4px;font-size:12px;font-weight:800}
.orig{text-decoration:line-through;color:#94A3B8;font-size:11px}
.now{font-size:16px;font-weight:800;color:#0F172A}
.btns{display:flex;flex-direction:column;gap:6px}
.btn{border-radius:20px;padding:8px;font-size:13px;font-weight:700;text-align:center;border:1px solid #CBD5E1;cursor:pointer}
.btn.prev{background:white;color:#0F172A}
.btn.order{background:#0F2A44;color:white;border-color:#0F2A44}
</style>
</head>
<body>
<div class="header"><div class="logo">sayido<span>.id</span></div><div class="login">👤 Login</div></div>
<div class="promo">PROMO MINGGU! <span id="cd"></span></div>

<div class="grid" id="grid"></div>

<script>
// Countdown
function tick(){
  let h=23,m=59,s=Math.floor(60 - new Date().getSeconds());
  document.getElementById('cd').innerHTML=`<b>${h} Jam</b> <b>${m} Menit</b> <b>${s} Detik</b>`;
}
setInterval(tick,1000); tick();

const products=[
{name:"Saci Exclusive",tag:"New",img:"https://images.unsplash.com/photo-1519741497674-611481863552?w=400"},
{name:"Monochrome Love",tag:"New",img:"https://images.unsplash.com/photo-1520854221256-17451ccdf07b?w=400"},
{name:"Loly Garden",tag:"Best",img:"https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?w=400"},
{name:"Moran Vintage",tag:"Best",img:"https://images.unsplash.com/photo-1511285560929-80b456fea0bc?w=400"},
{name:"Maca Serenity",tag:"Best",img:"https://images.unsplash.com/photo-1519225421980-715cb0215aed?w=400"},
{name:"Tera Midnight",tag:"Best",img:"https://images.unsplash.com/photo-1519741497674-611481863552?w=400"},
{name:"Gold Voyage",tag:"Best",img:"https://images.unsplash.com/photo-1520854221256-17451ccdf07b?w=400"},
{name:"Maroon Castle",tag:"Best",img:"https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?w=400"},
{name:"Allure Velvet",tag:"New",img:"https://images.unsplash.com/photo-1511285560929-80b456fea0bc?w=400"},
{name:"Tulip Fairy",tag:"New",img:"https://images.unsplash.com/photo-1520854221256-17451ccdf07b?w=400"},
{name:"Navy Ruins",tag:"Best",img:"https://images.unsplash.com/photo-1519225421980-715cb0215aed?w=400"},
{name:"Sage Pink",tag:"Best",img:"https://images.unsplash.com/photo-1519741497674-611481863552?w=400"},
];

document.getElementById('grid').innerHTML=products.map(p=>`
<div class="card">
<div class="badge ${p.tag.toLowerCase()}">${p.tag=='New'?'👑 New':'👑 Best'}</div>
<div class="imgbox"><img src="${p.img}"></div>
<div class="info">
<div class="title">🎁 ${p.name}</div>
<div class="pricebox"><div class="off">57%</div><div><div class="orig">Rp. 350.000</div><div class="now">Rp. 149.000</div></div></div>
<div class="btns"><div class="btn prev">👁 Preview</div><div class="btn order" onclick="window.open('https://wa.me/628123456789?text=Halo%20kak%20mau%20order%20${encodeURIComponent(p.name)}','_blank')">🛒 Order</div></div>
</div>
</div>
`).join('');
</script>
</body>
</html>
