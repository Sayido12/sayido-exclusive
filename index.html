<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SAYIDO.ID - Fixed Full</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>body{font-family:system-ui;background:#FFFBF7}.promo-bar{background:linear-gradient(90deg,#DC2626,#991B1B);display:flex;justify-content:space-between;align-items:center;padding:8px 12px;position:sticky;top:52px;z-index:20}.timer-mini{background:rgba(0,0,0,.28);border-radius:8px;min-width:44px;padding:4px 6px;text-align:center}.mockup-2{background:#E8E6E6;border-radius:14px;aspect-ratio:1/0.95;display:flex;gap:8px;justify-content:center;align-items:center;padding:10px}.phone{width:46%;aspect-ratio:9/19.5;background:white;border:1.5px solid #111;border-radius:12px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.18);display:flex;flex-direction:column}.modal-bg{background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}</style></head><body class="max-w-[420px] mx-auto bg-[#FFFBF7] pb-[80px]">
<header class="flex justify-between items-center px-4 py-3 bg-[#FFFBF7] sticky top-0 z-30 shadow-sm"><div class="font-extrabold text-[20px] text-[#0F2A4A]" style="font-family:serif">SAYIDO.ID</div><div class="flex gap-4 text-[18px]"><i class="fa-solid fa-magnifying-glass"></i><i class="fa-solid fa-cart-shopping"></i></div></header>
<div class="promo-bar"><div class="text-white font-extrabold text-[16px]">SPECIAL DISC 50%</div><div class="flex gap-1.5"><div class="timer-mini"><div id="h" class="text-white font-extrabold text-[17px]">05</div><div class="text-white/70 text-[8px]">Jam</div></div><div class="timer-mini"><div id="m" class="text-white font-extrabold text-[17px]">03</div><div class="text-white/70 text-[8px]">Menit</div></div><div class="timer-mini"><div id="s" class="text-white font-extrabold text-[17px]">23</div><div class="text-white/70 text-[8px]">Detik</div></div></div></div>
<div id="grid" class="grid grid-cols-2 gap-2.5 p-2.5"></div>
<div id="previewModal" class="fixed inset-0 modal-bg hidden z-[70] flex items-end justify-center"><div class="bg-white w-full max-w-[420px] h-[90vh] rounded-t-[20px] overflow-hidden flex flex-col"><div class="flex justify-between items-center p-4 border-b"><div class="font-bold" id="previewTitle">Preview</div><button onclick="closePreview()" class="w-8 h-8 bg-gray-100 rounded-full">✕</button></div><div class="flex-1 overflow-auto bg-[#FFFBF7] flex justify-center"><div class="w-[390px] bg-white min-h-full shadow-xl"><div id="previewContent" class="p-6"></div></div></div><div class="p-3 border-t grid grid-cols-2 gap-2"><button onclick="closePreview()" class="border py-3 rounded-full font-bold">Tutup</button><button onclick="fromPreviewToOrder()" class="bg-[#0F2A4A] text-white py-3 rounded-full font-bold">Order Sekarang</button></div></div></div>
<div id="orderModal" class="fixed inset-0 modal-bg hidden z-[60] flex items-end justify-center"><div class="bg-white w-full max-w-[420px] rounded-t-[20px] p-5 max-h-[90vh] overflow-auto"><div class="flex justify-between"><h2 class="font-extrabold text-[15px]">Order <span id="modalThemeName">FLORAL 1</span></h2><button onclick="closeModal()" class="text-[20px]">✕</button></div><div class="text-[11px] text-[#C1272D] font-bold mt-1">SPECIAL DISC 50% - <span id="countdownModal">05:03:23</span> lagi!</div><div class="mt-4 space-y-3"><div class="grid grid-cols-2 gap-2"><input id="f_groom" placeholder="Nama pria *" class="border rounded-xl p-3.5 text-[13px] w-full"><input id="f_bride" placeholder="Nama wanita *" class="border rounded-xl p-3.5 text-[13px] w-full"></div><input id="f_wa" placeholder="No WA aktif *" class="border rounded-xl p-3.5 text-[13px] w-full"><input id="f_date" type="date" class="border rounded-xl p-3.5 text-[13px] w-full"><input id="f_maps" placeholder="Alamat / GMaps *" class="border rounded-xl p-3.5 text-[13px] w-full"></div><div class="mt-4 bg-[#0F2A4A] text-white rounded-xl p-4"><div class="flex justify-between text-[12px] opacity-80"><span>Subtotal</span><span id="subVal">Rp99.000</span></div><div class="flex justify-between font-extrabold text-[14px] mt-1"><span>Total (Disc 50%)</span><span id="totalVal">Rp49.500</span></div></div><button onclick="sendWA()" class="w-full mt-4 bg-[#0F2A4A] text-white py-4 rounded-full font-extrabold">Kirim Form ke WA Admin →</button></div></div>
<script>
let themes=[]; [['FLORAL',10],['BUGOY',10],['NAVY',5],['LUXU',10],['SAGE',5],['RUSTIC',10]].forEach(([p,c])=>{for(let i=1;i<=c;i++)themes.push({name:p+' '+i, realName:p+' '+i, pre:p, num:i, price:99000, fake:338000})});
function render(){const g=document.getElementById('grid'); g.innerHTML=''; themes.forEach(t=>{const d=document.createElement('div'); d.className='bg-white rounded-[14px] border shadow-sm p-1.5'; d.innerHTML=`<div class="relative"><div class="bg-[#E8E6E6] rounded-xl aspect-[1/0.95] flex gap-2 justify-center items-center p-2"><div class="w-[46%] aspect-[9/19.5] bg-white border-2 border-black rounded-xl flex items-center justify-center text-[8px] font-bold">${t.name}</div><div class="w-[46%] aspect-[9/19.5] bg-white border-2 border-black rounded-xl flex items-center justify-center text-[6px]">RSVP</div></div><div class="absolute top-1.5 left-1.5 bg-[#0F2A4A] text-white text-[9px] font-bold px-2 py-1 rounded">New 🔥</div><div class="absolute top-1.5 right-1.5 bg-[#C1272D] text-white text-[9px] font-bold px-2 py-1 rounded">Best 👑</div></div><div class="text-center pt-2"><div class="font-extrabold text-[13px]">${t.name}</div><div class="flex justify-center gap-1 mt-1"><span class="bg-[#C1272D] text-white text-[8px] px-1 rounded">50%</span><span class="line-through text-[10px] text-gray-400">Rp. 338.000</span></div><div class="font-extrabold text-[15px]">Rp. 99.000</div><div class="grid grid-cols-2 gap-1 mt-2"><button onclick="openPreview('${t.realName}','${t.pre}',${t.num})" class="border text-[10px] py-2 rounded-lg font-bold">Preview</button><button onclick="openModal('${t.realName}',${t.price},'${t.pre}')" class="bg-[#0F2A4A] text-white text-[10px] py-2 rounded-lg font-bold">Order</button></div></div>`; g.appendChild(d);});}
function updateCountdown(){const now=new Date(); const end=new Date(); end.setHours(23,59,59,999); let diff=end-now; if(diff<0) diff+=86400000; const h=Math.floor(diff/3600000), m=Math.floor(diff%3600000/60000), s=Math.floor(diff%60000/1000); document.getElementById('h').innerText=String(h).padStart(2,'0'); document.getElementById('m').innerText=String(m).padStart(2,'0'); document.getElementById('s').innerText=String(s).padStart(2,'0'); const mc=document.getElementById('countdownModal'); if(mc) mc.innerText=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;} setInterval(updateCountdown,1000); updateCountdown(); render();
let curName='',curPrice=0,curPre='FLORAL';
function openPreview(name,pre,num){curName=name; curPre=pre; document.getElementById('previewTitle').innerText='Preview '+name; document.getElementById('previewContent').innerHTML=`<div style="text-align:center"><div style="height:280px;background:#FFEAD1;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:900">${name} - Wedding Invitation<br>390px Preview Real</div><h1 style="font-family:serif;font-size:26px;margin-top:16px">The Wedding of</h1><h2 style="font-size:20px;font-weight:900">${name}</h2></div>`; document.getElementById('previewModal').classList.remove('hidden');}
function closePreview(){document.getElementById('previewModal').classList.add('hidden');}
function fromPreviewToOrder(){closePreview(); setTimeout(()=>openModal(curName,99000,curPre),200);}
function openModal(name,price,pre){curName=name; curPrice=price; curPre=pre||'FLORAL'; document.getElementById('modalThemeName').innerText=name; document.getElementById('subVal').innerText='Rp'+price.toLocaleString('id-ID'); document.getElementById('totalVal').innerText='Rp'+Math.round(price*0.5).toLocaleString('id-ID'); document.getElementById('orderModal').classList.remove('hidden');}
function closeModal(){document.getElementById('orderModal').classList.add('hidden');}
function sendWA(){const g=document.getElementById('f_groom').value.trim(), b=document.getElementById('f_bride').value.trim(), wa=document.getElementById('f_wa').value.trim(); if(!g||!b||!wa){alert('Isi Nama & WA dulu'); return;} const total=Math.round(curPrice*0.5); const h=document.getElementById('h').innerText, m=document.getElementById('m').innerText, s=document.getElementById('s').innerText; const txt=`Halo Admin SAYIDO.ID %0AORDER BARU%0ATema: ${curName}%0A${g} & ${b}%0AWA: ${wa}%0ATotal: Rp${total.toLocaleString('id-ID')} - SPECIAL DISC 50%25 Sisa ${h}:${m}:${s}`; window.open(`https://wa.me/6281908112259?text=${txt}`,'_blank'); closeModal();}
</script>
<div class="fixed bottom-0 w-full max-w-[420px] bg-white border-t flex justify-around py-2.5 text-[11px] z-30"><span>Home</span><span class="font-bold border-b-2 border-[#D4AF37]">Catalog</span><span>Orders</span><span>Profile</span></div>
</body></html>
